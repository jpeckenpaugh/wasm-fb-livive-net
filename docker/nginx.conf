server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Explicit: don't depend on the base image's mime.types being current.
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/javascript mjs;
        application/wasm wasm;
    }

    # A stale .wasm after a rebuild is the most common dev papercut.
    location /build/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /v2/build/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    gzip off;
}
